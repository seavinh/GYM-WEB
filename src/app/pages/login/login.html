<div class="auth-page">
  <!-- Background decorations -->
  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none;">
    <div style="position: absolute; top: 20%; right: 15%; width: 300px; height: 300px;
                background: radial-gradient(circle, rgba(74,222,128,0.05) 0%, transparent 70%);"></div>
    <div style="position: absolute; bottom: 20%; left: 10%; width: 250px; height: 250px;
                background: radial-gradient(circle, rgba(96,165,250,0.04) 0%, transparent 70%);"></div>
  </div>

  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="logo-icon">
        <i class="bi bi-lightning-charge-fill" style="color: #000; font-size: 20px;"></i>
      </div>
      <h2>Fit<span>Life</span></h2>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your management dashboard</p>

    <!-- Error Alert -->
    @if (error) {
      <div class="alert-error" style="margin-bottom: 20px;">
        <i class="bi bi-exclamation-circle-fill"></i>
        {{ error }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" id="login-form">
      <div class="auth-form-group">
        <label for="login-username">Username</label>
        <div class="auth-input-icon">
          <i class="bi bi-person"></i>
          <input
            type="text"
            class="auth-input"
            id="login-username"
            [(ngModel)]="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="auth-form-group">
        <label for="login-password">Password</label>
        <div class="auth-input-icon">
          <i class="bi bi-lock"></i>
          <input
            type="password"
            class="auth-input"
            id="login-password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <button type="submit" class="auth-btn" id="login-submit" [disabled]="loading">
        @if (loading) {
          <div class="auth-spinner"></div>
          Signing in...
        } @else {
          <i class="bi bi-box-arrow-in-right"></i>
          Sign In
        }
      </button>
    </form>

    <div class="auth-link">
      Don't have an account? <a routerLink="/register">Create one</a>
    </div>
  </div>
</div>
